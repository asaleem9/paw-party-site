[package]
name = "paw-party-demo"
version = "0.1.0"
edition = "2021"
description = "The playable mouse-catching demo on the Paw Party site"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Browser bindings are only needed for the WebAssembly build, so the game rules
# can be tested natively with plain `cargo test`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "HtmlImageElement"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
